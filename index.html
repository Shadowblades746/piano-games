<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NoteReader — Piano Sight-Reading &amp; Ear Training</title>
    <meta name="description" content="Piano sight-reading flashcards and ear-training games with MIDI keyboard, voice and touch input.">
    <meta name="theme-color" content="#2c1e16">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d63dc'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='white'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Music&text=%F0%9D%84%9E%F0%9D%84%A2&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="src/main.js"></script>
</head>
<body class="flex flex-col text-[#2c1e16]">

    <!-- Shared header: brand, MIDI status, drill timer, score/streak, game switcher -->
    <header style="padding-top: var(--safe-top)" class="sticky top-0 z-30 bg-[#2c1e16]/95 backdrop-blur-md border-b border-[#4a3325] text-[#fdf6e7] shadow-md">
        <div class="max-w-5xl mx-auto px-3 sm:px-6 py-2 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-[#3b82f6] to-[#1d4ed8] text-white flex items-center justify-center font-display font-bold text-sm shadow-sm border border-[#93c5fd]/50 shrink-0">♪</div>
                <span class="hidden min-[420px]:inline font-display font-bold text-sm sm:text-base tracking-tight text-[#fdf6e7] truncate">Note<span class="text-[#7dd3fc]">Reader</span></span>
            </div>

            <div class="flex flex-wrap items-center justify-end gap-1.5 sm:gap-2">
                <button id="midiConnectBtn" type="button" class="inline-flex items-center gap-1.5 bg-[#3d2a1f] hover:bg-[#4e3729] border border-[#5e4332] rounded-full px-2.5 py-1 text-xs font-medium text-[#f5ecd8] transition cursor-pointer" title="Connect USB MIDI Piano (e.g., Yamaha P-125)">
                    <span id="midiStatusDot" class="w-2 h-2 rounded-full bg-amber-300/70 shrink-0"></span>
                    <span id="midiStatusLabel" class="max-w-[72px] min-[400px]:max-w-[95px] sm:max-w-[150px] truncate">Connect MIDI</span>
                </button>

                <button id="drillTimerBtn" type="button" class="inline-flex items-center gap-1 bg-[#3d2a1f] hover:bg-[#4e3729] border border-[#5e4332] rounded-full px-2.5 py-1 text-xs font-semibold text-[#f5ecd8] transition cursor-pointer" title="Tap to start/reset 2-minute daily practice timer">
                    <span class="text-amber-300">⏱</span>
                    <span id="timerDisplay">2:00</span>
                </button>

                <div class="inline-flex items-center gap-1 bg-amber-400/20 border border-amber-400/40 rounded-full px-2.5 py-1 text-xs font-bold text-amber-200" title="Cards completed this session">
                    <span class="text-amber-300">★</span>
                    <span id="scoreDisplay">0</span>
                </div>

                <div class="inline-flex items-center gap-1 bg-amber-400/20 border border-amber-400/40 rounded-full px-2.5 py-1 text-xs font-bold text-amber-200" title="Current streak">
                    <span aria-hidden="true">🔥</span>
                    <span id="streakDisplay">0</span>
                </div>

                <!-- Game-specific header buttons are injected here by the active game -->
                <span id="headerActions" class="contents"></span>
            </div>
        </div>

        <!-- Game switcher (built from src/games/registry.js) -->
        <nav id="gameNav" aria-label="Games" class="max-w-5xl mx-auto px-3 sm:px-6 pb-2 flex gap-1.5 overflow-x-auto no-scrollbar"></nav>
    </header>

    <!-- The active game renders here -->
    <main id="gameRoot" class="flex-1 flex flex-col justify-between max-w-5xl w-full mx-auto px-2.5 sm:px-6 py-2.5 sm:py-4 gap-2.5 sm:gap-3.5">
        <noscript><p class="text-center text-amber-100">NoteReader needs JavaScript to run.</p></noscript>
    </main>

    <!-- Required CC BY 3.0 attribution for the Salamander Grand Piano samples -->
    <footer>
        <p class="text-center text-[10px] text-amber-100/40 pb-2 px-2">Piano samples: Salamander Grand Piano by Alexander Holm (<a class="underline" href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>) · <span id="pianoStatus">Piano sound: loading…</span></p>
    </footer>

    <!-- Non-blocking toast -->
    <div id="toastBox" role="status" aria-live="polite" style="top: calc(var(--safe-top) + 3.75rem)" class="fixed left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300 bg-[#2c1e16]/95 text-[#fdf6e7] border border-[#5e4332] px-4 py-2 rounded-full shadow-lg text-xs font-medium text-center max-w-xs sm:max-w-sm"></div>
</body>
</html>
