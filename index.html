<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NoteReader — Piano Sight-Reading &amp; Ear Training</title>
    <meta name="theme-color" content="#2c1e16">
    <meta name="description" content="Hoffman Academy inspired piano sight-reading and ear-training practice suite with Web MIDI, Web Speech, and Salamander Grand Piano samples.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d63dc'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='white'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Music&text=%F0%9D%84%9E%F0%9D%84%A2&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex flex-col text-[#2c1e16]">

    <!-- Cozy Dark-Wood & Warm-Amber Top Navigation Bar -->
    <header style="padding-top: var(--safe-top)" class="sticky top-0 z-30 bg-[#2c1e16]/95 backdrop-blur-md border-b border-[#4a3325] text-[#fdf6e7] shadow-md">
        <div class="max-w-5xl mx-auto px-3 sm:px-6 py-2 flex items-center justify-between gap-2">
            <!-- Warm Cozy Brand Identity -->
            <div class="flex items-center gap-2 min-w-0">
                <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-[#3b82f6] to-[#1d4ed8] text-white flex items-center justify-center font-display font-bold text-sm shadow-sm border border-[#93c5fd]/50 shrink-0">
                    ♪
                </div>
                <span class="hidden min-[420px]:inline font-display font-bold text-sm sm:text-base tracking-tight text-[#fdf6e7] truncate">
                    Note<span class="text-[#7dd3fc]">Reader</span>
                </span>
            </div>

            <!-- Plugin-Style Game Switcher Tabs -->
            <nav id="gameSwitcher" aria-label="Game Switcher" class="inline-flex items-center bg-[#1d140e] p-0.5 sm:p-1 rounded-full border border-[#4a3325] shadow-inner">
                <!-- Dynamically generated from registry.js -->
            </nav>

            <!-- Unified Status & Utility Controls -->
            <div class="flex items-center gap-1 sm:gap-2 shrink-0">
                <!-- MIDI Device Status Pill -->
                <button id="midiConnectBtn" type="button" class="inline-flex items-center gap-1.5 bg-[#3d2a1f] hover:bg-[#4e3729] border border-[#5e4332] rounded-full px-2.5 py-1 text-xs font-medium text-[#f5ecd8] transition cursor-pointer" title="Connect USB MIDI Piano (e.g., Yamaha P-125)">
                    <span id="midiStatusDot" class="w-2 h-2 rounded-full bg-amber-300/70 shrink-0"></span>
                    <span id="midiStatusLabel" class="max-w-[70px] min-[400px]:max-w-[95px] sm:max-w-[140px] truncate">Connect MIDI</span>
                </button>

                <!-- 2-Min Daily Drill Timer -->
                <button id="drillTimerBtn" type="button" class="inline-flex items-center gap-1 bg-[#3d2a1f] hover:bg-[#4e3729] border border-[#5e4332] rounded-full px-2.5 py-1 text-xs font-semibold text-[#f5ecd8] transition cursor-pointer" title="Tap to start/reset 2-minute daily practice drill">
                    <span class="text-amber-300">⏱</span>
                    <span id="timerDisplay">2:00</span>
                </button>

                <!-- Streak / Score Counter -->
                <div class="inline-flex items-center gap-1 bg-amber-400/20 border border-amber-400/40 rounded-full px-2.5 py-1 text-xs font-bold text-amber-200" title="Practice Streak / Score">
                    <span class="text-amber-300">★</span>
                    <span id="scoreDisplay">0</span>
                </div>

                <!-- Browser Synth Audio Mute Button -->
                <button id="synthMuteBtn" type="button" class="inline-flex items-center justify-center w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-[#3d2a1f] hover:bg-[#4e3729] border border-[#5e4332] text-xs font-medium text-[#f5ecd8] transition cursor-pointer" title="Toggle browser piano sound">
                    <span id="synthMuteIcon">🔊</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Game Mount Workspace -->
    <main id="appMount" class="flex-1 flex flex-col w-full">
        <!-- Active game mounts here -->
    </main>

    <!-- Footer Attribution & Sound Engine Status -->
    <footer class="text-center text-[10px] text-amber-100/40 pb-2 px-2">
        <p>Piano samples: Salamander Grand Piano by Alexander Holm (CC BY 3.0) · <span id="pianoStatus">Piano sound: loading…</span></p>
    </footer>

    <!-- Custom Non-Blocking Toast Message Box -->
    <div id="toastBox" role="status" aria-live="polite" class="fixed left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300 bg-[#2c1e16]/95 text-[#fdf6e7] border border-[#5e4332] px-4 py-2 rounded-full shadow-lg text-xs font-medium text-center max-w-xs sm:max-w-sm">
    </div>

    <!-- Application Entrypoint:
         - When opened via file:/// (e.g. double-clicked from disk), loads dist/app.bundle.js
           because browsers block raw ES module imports on file:// origins due to CORS.
         - When served over http:// or https:// (Vercel, GitHub Pages, localhost), loads src/main.js natively.
    -->
    <script>
        if (window.location.protocol === 'file:') {
            const s = document.createElement('script');
            s.src = 'dist/app.bundle.js';
            document.body.appendChild(s);
        }
    </script>
    <script type="module">
        if (window.location.protocol !== 'file:') {
            import('./src/main.js');
        }
    </script>
</body>
</html>
